name: Bug Report
description: Report a bug in the Hermes Mastra plugin
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Reproduction Steps
      description: Steps to reproduce the behavior.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Details about your runtime environment.
      placeholder: |
        - OS:
        - Bun version:
        - Hermes version:
    validations:
      required: false

  - type: input
    id: mastra-plugin-version
    attributes:
      label: Mastra Plugin Version
      description: The version of the Hermes Mastra plugin you are using.
      placeholder: e.g. 0.1.0
    validations:
      required: true
