    title: Create test_plugin_clash.py covering namespace ownership
    phase: RED
    status: pending
    user_value: "every plugin-owned resource has a stable, collision-free
      name; users can install Mastra alongside any combination of other
      Hermes plugins without name conflicts."
    dependencies: []
    blocking_tasks: [T05]
    prerequisites:
      - analysis/plugin-clash-analysis.md exists
      - analysis/plugin-contract.md exists
    source_evidence:
      files:
        - ~/.hermes/hermes-agent/hermes_cli/plugins.py
        - ~/.hermes/hermes-agent/agent/memory_manager.py
      docs: [plugin-contract.md, plugin-clash-analysis.md]
      claims:
        - "kind=exclusive memory plugins go through plugins/memory/ loader"
        - "tool names are routed by MemoryManager._tool_to_provider"
        - "register_hook puts callbacks in load order; no priority"
    validation_steps:
      - mise run test (file collects without import error)
      - mise run test -- tests/test_plugin_clash.py (RED — assertions fail
        only where bugs would, not import errors)
    ci_cd_commands: [mise run test, mise run lint]
    styleguide_rules: [<=200 LOC, <=30 LOC per construct, depth<=3]
    guardrails: [no mocks of Hermes runtime; use direct module imports]
    learnings: ""
    gotchas: ""
    rollback_or_rewind_notes: "delete the new file; nothing else changes."
    affected_files: [tests/test_plugin_clash.py]
    completion_evidence: ""

