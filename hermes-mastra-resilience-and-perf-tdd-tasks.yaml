styleguide_rules:
  S1_file_size_200loc: "Every source file <=200 LOC (non-blank, non-comment). Split before bumping."
  S2_construct_30loc: "Every function/class/method/component/test body <=30 LOC."
  S3_nesting_depth_3: "Maximum nesting depth 3 in .py/.ts/.sh; relative to the test declaration in tests."
  S4_cognitive_complexity_8: "Cognitive complexity <=8 (biome for TS, ruff for Python)."
  S5_no_mocks_or_stubs: "No TODOs, mocks, stubs, placeholders, fake services, or simulated functionality in production code; tests must use real behaviour and real fixtures."
  S6_real_behavior_only: "Tests target observable user-facing behaviour, contracts, APIs, interfaces, and workflows; never implementation details."
  S7_tdd_first: "BOOTSTRAP -> RED -> GREEN -> REFACTOR for every change. Tests precede implementation."
  S8_user_facing_validation: "validation_steps describe observable user-visible checks, never how to implement."
  S9_squashed_human_commits: "Final commit is squashed with [name] <email> trailer; no co-author trailers, no agent-authored commits."
  S10_mise_only_cli: "Every user-facing entry point goes through mise tasks; no ad-hoc shell pipelines."

guardrails:
  G1_no_kwargs_mutation: "Plugin hooks must never mutate kwargs passed by Hermes; kwargs are shared across plugins."
  G2_no_monkeypatching_core: "No monkey-patching of Hermes agent core modules (agent/, hermes_cli/, gateway/, run_agent.py)."
  G3_hot_path_under_100ms: "Every hot-path hook returns in <=100ms p99 even with fault injection (slow client, dead server, queue saturation)."
  G4_never_raise_into_host: "No exception escapes a plugin hook into the Hermes loop. Wrap with safe_call or equivalent boundary."
  G5_no_cross_profile_leak: "Recall cache, working memory, observations, and threads must filter by resourceId; profile flip clears caches synchronously."
  G6_drop_oldest_under_saturation: "Bounded async runner queue drops oldest under burst overflow; producer never blocks."
  G7_no_blocking_io_in_hooks: "No HTTP, disk, or DB I/O on hook hot path; only enqueue + return cached state."
  G8_redact_secrets_in_logs: "API keys, auth tokens, and DB URLs must be redacted in every log line."
  G9_validate_responses_at_boundary: "Every server response is shape-validated before deserialization; oversized payloads (>response_max_bytes) rejected."
  G10_fail_closed_circuit_breaker: "When breaker is OPEN, hooks no-op deterministically and return cached state; recovery is half-open + cooldown."
  G11_supervised_subprocess_lifecycle: "Bun server PID lifecycle goes through supervisor.py; SIGTERM-then-SIGKILL with timeout; restart bounded by max-per-minute."
  G12_idempotent_observation_writes: "write_observation is idempotent on (thread, profile, kind, normalized_text); duplicate suppression via dedup LRU."

