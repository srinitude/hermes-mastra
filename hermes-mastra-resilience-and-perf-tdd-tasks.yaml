principles:
  P02: "Make expected failure part of the domain model — distinguish recoverable failures from defects."
  P03: "Separate recoverable failures from defects; defects fail fast with rich diagnostic context."
  P04: "Preserve failure causes (category, operation, retryability, dependency name, correlation id) — never reduce to Error('something went wrong')."
  P05: "Design every resource with a lifecycle (owner, scope, acquisition, cleanup, failure behavior)."
  P06: "Make cancellation and interruption first-class; long-running work is cancellable."
  P07: "Use structured concurrency; parents own children with explicit cancel/join policy."
  P08: "Push dependencies to the boundary; business logic depends on interfaces, not concrete clients."
  P10: "Validate and transform external data once at the boundary; operate internally on validated domain data."
  P11: "Treat configuration as typed, validated, redacted; fail startup on malformed config."
  P12: "Build timeout, retry, backoff, and idempotency policy into every external call."
  P13: "Optimize based on measurement, not intuition — instrument before optimizing."
  P14: "Make observability part of execution; emit structured telemetry for every meaningful operation."
  P15: "Cache deliberately with explicit invalidation, freshness, error, and concurrency semantics."
  P16: "Serialize shared-state updates with locks/queues/transactions when consistency matters."
  P17: "Compose small testable units into workflows; avoid large imperative procedures."
  P18: "Keep provider-specific details behind stable application contracts."

