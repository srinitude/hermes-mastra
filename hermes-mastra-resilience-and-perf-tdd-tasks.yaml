agent_runtime_protocol:
  status_transitions:
    - "pending -> in_progress when the agent picks up the task"
    - "in_progress -> completed when every validation_steps entry is observed"
    - "in_progress -> blocked when a prerequisite or dependency surfaces a hard blocker"
    - "blocked -> in_progress when the blocker is resolved (record it under learnings)"
    - "any -> cancelled only when the goal contract is amended; record the rationale under gotchas"
  mutable_fields:
    - "status"
    - "learnings"
    - "gotchas"
  immutable_fields:
    - "id"
    - "title"
    - "prerequisites"
    - "dependencies"
    - "blocking_tasks"
    - "validation_steps"
    - "ci_commands"
    - "styleguide_rules"
    - "guardrails"
    - "context_files"
    - "context_urls"
    - "principle_ids"
  resume_protocol:
    - "On resume, find the highest-priority task whose prerequisites/dependencies are satisfied AND status in {pending, in_progress, blocked-and-now-unblocked}."
    - "Never restart RED phase if all RED tests are already committed and observed failing."
    - "Never edit production code while any RED task is pending or in_progress (RED hard_gate)."
    - "Refresh Firecrawl maps if any are older than 7 days before consuming context_urls."
    - "Re-run mise run compat:hermes + mise run compat:mastra at the start of every resume; halt if either drifts."
    - "Append every recovered fact to the relevant task's learnings; append every pitfall to gotchas."
